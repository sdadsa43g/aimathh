services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${AIMATHH_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AIMATHH_ENV: prod
      AIMATHH_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=1g
    user: "65532:65532"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped
